name: Build original APK

# Builds an installable APK from DevStack06/Whatsapp-Clone-Flutter exactly as published.
#
# The app source is checked out from that repository and nothing in it is modified — no pubspec
# edit, no manifest edit, no dependency change. This workflow exists only to supply a toolchain:
# the project pins AGP 3.5.0 / Gradle 5.6.2 (2021), which will not run on a modern JDK, and no
# Flutter or Android SDK is installed on the machine the request came from.
#
# It lives on its own branch so it does not touch the app code on master.

on:
  push:
    branches: [build/original-apk]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The committed pubspec.lock was resolved for Dart 2.12 and pulls in win32 1.7.4 and ffi 0.1.3.
        # Both declare `sdk: <3.0.0`, so pub resolves them on any Dart 2.x — but the compiler rejects
        # them from Dart 2.13 onward ("Struct 'STATSTG' is empty", "Expected type 'T' to be a valid and
        # instantiated subtype of 'NativeType'"). Flutter 2.5.3 (Dart 2.14) and 2.10.5 (Dart 2.16) both
        # fail on exactly that, so the SDK has to be old enough to still accept those packages.
        #
        # 2.0.6 ships Dart 2.12.4, the version the lock was written against, and is the expected match.
        # 2.2.3 (Dart 2.13.4) is built alongside it to bracket whether the restriction arrived in 2.13
        # or 2.14.
        include:
          - flutter: "2.0.6"
            extra_args: ""
          - flutter: "2.2.3"
            extra_args: ""
    name: flutter ${{ matrix.flutter }}
    steps:
      - name: Check out the original app, unmodified
        uses: actions/checkout@v4
        with:
          repository: DevStack06/Whatsapp-Clone-Flutter
          ref: master
          path: src

      - name: Record exactly which revision is being built
        working-directory: src
        run: |
          echo "revision: $(git rev-parse HEAD)"
          git log --oneline -1
          echo "--- pubspec dependencies ---"
          sed -n '/^dependencies:/,/^dev_dependencies:/p' pubspec.yaml

      - name: Install the Android SDK packages this project targets
        run: |
          # Runs before setup-java, so it uses the image's default JDK, which the modern
          # cmdline-tools require. Tolerated failure is fine: AGP 3.5.0 self-downloads any missing
          # platform or build-tools revision, because the image already has the licences accepted.
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-29" "platforms;android-28" "build-tools;28.0.3" "build-tools;29.0.3" "platform-tools" > /dev/null || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android Gradle Plugin 3.5.0 was built for JDK 8, and Gradle 5.6.2 will not run at all
          # on JDK 17+. JDK 8 is the combination this project was written against.
          java-version: "8"

      - name: Install Flutter ${{ matrix.flutter }}
        run: |
          curl -fsSL -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ matrix.flutter }}-stable.tar.xz"
          tar xf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"

      - name: Point Gradle at a mirror that still has the project's dependencies
        run: |
          # The project's video_player 1.0.1 plugin depends on com.google.android.exoplayer:*:2.12.1.
          # That revision only ever lived on JCenter, which is gone — Google's Maven starts at 2.13.3
          # and Maven Central never carried it — so the build cannot resolve it from any repository
          # the project declares. Aliyun's mirror of JCenter still serves the 2.12.1 archives, so it
          # is added here.
          #
          # This is an environment-level repository injection via a Gradle init script: it goes in
          # ~/.gradle/init.d and is deliberately NOT a change to android/build.gradle, so the app
          # source and its declared dependencies stay exactly as the upstream repository has them.
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/jcenter-mirror.gradle" <<'EOF'
          gradle.projectsLoaded {
              gradle.rootProject.allprojects {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/jcenter' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                  }
              }
          }
          EOF
          echo "--- init script ---"
          cat "$HOME/.gradle/init.d/jcenter-mirror.gradle"
          echo "--- proof the mirror serves the dead artifact ---"
          curl -sL -o /dev/null -w "exoplayer-core-2.12.1.aar -> %{http_code} (%{size_download} bytes)\n" \
            "https://maven.aliyun.com/repository/jcenter/com/google/android/exoplayer/exoplayer-core/2.12.1/exoplayer-core-2.12.1.aar"

      - name: Build the APK
        working-directory: src
        run: |
          flutter --version
          java -version
          flutter pub get
          # shellcheck disable=SC2086
          flutter build apk --release ${{ matrix.extra_args }}
          echo "--- output ---"
          ls -la build/app/outputs/flutter-apk/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-original-flutter-${{ matrix.flutter }}
          path: src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
